<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CREW/DECK - Mission Control for People</title>
  <meta name="description" content="Production-ready Employee Management System with deep ink aesthetics, command palette, interactive org constellation, and real-time HR operations.">
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app-root">
    <!-- Slim Rail Navigation -->
    <nav class="nav-rail" aria-label="Main Navigation">
      <div id="brand-icon" class="brand-icon" title="CREW/DECK Mission Deck">
        C/D
      </div>

      <div class="nav-links">
        <button class="nav-item active" data-view="dashboard" data-tooltip="Mission Deck" aria-label="Mission Deck">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
            <rect x="3" y="3" width="7" height="9" rx="1"/>
            <rect x="14" y="3" width="7" height="5" rx="1"/>
            <rect x="14" y="12" width="7" height="9" rx="1"/>
            <rect x="3" y="16" width="7" height="5" rx="1"/>
          </svg>
        </button>

        <button class="nav-item" data-view="employees" data-tooltip="Employee Directory" aria-label="Employees">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
            <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
            <circle cx="9" cy="7" r="4"/>
            <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
            <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
          </svg>
        </button>

        <button class="nav-item" data-view="org" data-tooltip="Org Constellation" aria-label="Org Constellation">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
            <circle cx="12" cy="5" r="3"/>
            <circle cx="6" cy="19" r="3"/>
            <circle cx="18" cy="19" r="3"/>
            <line x1="12" y1="8" x2="6" y2="16"/>
            <line x1="12" y1="8" x2="18" y2="16"/>
          </svg>
        </button>

        <button class="nav-item" data-view="departments" data-tooltip="Departments" aria-label="Departments">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
            <rect x="2" y="7" width="20" height="14" rx="2" ry="2"/>
            <path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/>
          </svg>
        </button>

        <button class="nav-item" data-view="attendance" data-tooltip="Attendance & Heatmap" aria-label="Attendance">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
            <circle cx="12" cy="12" r="10"/>
            <polyline points="12 6 12 12 16 14"/>
          </svg>
        </button>

        <button class="nav-item" data-view="leave" data-tooltip="Leave Operations" aria-label="Leave">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
            <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
            <line x1="16" y1="2" x2="16" y2="6"/>
            <line x1="8" y1="2" x2="8" y2="6"/>
            <line x1="3" y1="10" x2="21" y2="10"/>
          </svg>
        </button>

        <button class="nav-item" data-view="payroll" data-tooltip="Payroll Summaries" aria-label="Payroll">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
            <line x1="12" y1="1" x2="12" y2="23"/>
            <path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>
          </svg>
        </button>

        <button class="nav-item" data-view="audit" data-tooltip="Audit Trail" aria-label="Audit">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
            <polyline points="14 2 14 8 20 8"/>
            <line x1="16" y1="13" x2="8" y2="13"/>
            <line x1="16" y1="17" x2="8" y2="17"/>
            <polyline points="10 9 9 9 8 9"/>
          </svg>
        </button>
      </div>

      <div class="rail-footer">
        <button id="theme-toggle-btn" class="theme-toggle-btn" aria-label="Toggle Theme">
          ☀️
        </button>
      </div>
    </nav>

    <!-- Main Viewport Area -->
    <main class="main-wrapper">
      <!-- Top Command Bar -->
      <header class="top-bar">
        <div class="top-bar-left">
          <div class="page-title">
            <span id="page-title-text">Mission Deck</span>
            <span id="page-title-badge" class="page-badge">OVERVIEW</span>
          </div>
        </div>

        <div class="top-bar-right">
          <button id="search-trigger" class="search-trigger" aria-label="Open Command Palette">
            <span>🔍 Search actions or crew...</span>
            <kbd class="kbd">⌘K</kbd>
          </button>

          <div id="user-badge" class="user-badge">
            <div class="avatar-circle" style="background-color: var(--accent-amber);">AD</div>
            <span style="font-weight: 600; font-size: 12px;">Admin</span>
            <span class="user-role-badge">ADMIN</span>
          </div>
        </div>
      </header>

      <!-- Scrollable Viewport -->
      <div id="viewport-content" class="viewport-content"></div>
    </main>
  </div>

  <!-- Scripts -->
  <script src="js/mock_backend.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/drawer.js"></script>
  <script src="js/command_palette.js"></script>
  <script src="js/constellation.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
