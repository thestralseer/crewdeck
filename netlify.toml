[build]
  publish = "public"
  functions = "netlify/functions"

# Route API calls to Netlify Functions serverless handler
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

# Health check endpoint
[[redirects]]
  from = "/healthz"
  to = "/.netlify/functions/api/healthz"
  status = 200

# SPA Fallback for direct browser access
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
