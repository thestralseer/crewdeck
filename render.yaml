services:
  - type: web
    name: crewdeck
    env: docker
    plan: free
    envVars:
      - key: PORT
        value: 10000
      - key: DB_PATH
        value: /app/data/crewdeck.db
      - key: ADMIN_EMAIL
        value: admin@crewdeck.io
      - key: ADMIN_PASSWORD
        value: admin123
    # Note: On paid plans ($7+/mo), uncomment the disk block below for persistent storage:
    # disk:
    #   name: crewdeck_data
    #   mountPath: /app/data
    #   sizeGB: 1
